site_name: S.A.G.E. Documentation
site_description: Documentation for S.A.G.E. Match Control Experts' tournament tooling.
site_url: https://sage-match-control.github.io/sage-docs/
repo_url: https://github.com/sage-match-control/sage-docs
repo_name: sage-match-control/sage-docs
edit_uri: edit/main/docs/
# The docs version. Bump it with a new entry at the top of docs/changelog.md;
# the deploy workflow checks the two agree.
copyright: 'S.A.G.E. Documentation <a href="https://sage-match-control.github.io/sage-docs/changelog/">v2.2.1</a>'

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  font: false
  favicon: https://sage-match-control.github.io/assets/logo.png
  logo: https://sage-match-control.github.io/assets/logo.png
  palette:
    scheme: default
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist

nav:
  - Home: README.md
  - Usage:

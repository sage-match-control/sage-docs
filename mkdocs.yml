site_name: S.A.G.E. Documentation
site_description: Documentation for S.A.G.E. Match Control Experts' tournament tooling.
site_url: https://sage-match-control.github.io/sage-docs/
repo_url: https://github.com/sage-match-control/sage-docs
repo_name: sage-match-control/sage-docs
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  font: false
  favicon: https://sage-match-control.github.io/assets/logo.png
  logo: https://sage-match-control.github.io/assets/logo.png
  palette:
    scheme: default
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: README.md
  - Features & Usage:
      - Overview: features/README.md
      - Tournament Hub: features/tournament-hub.md
      - Control Center: features/control-center.md
      - Preparing an event: features/preparing-an-event.md
      - Running an event, day of: features/running-an-event-day.md
      - Scoresheet Generator: features/scoresheet-generator.md
      - Tournament Calculator: features/tournament-calculator.md
      - Dual Meet Sheet Generator: features/dual-meet-sheet-generator.md
  - Technical:
      - Overview: technical/README.md
      - Architecture: technical/architecture.md
      - Sync pipeline: technical/sync-pipeline.md
      - Scoresheet pipeline: technical/scoresheet-pipeline.md
      - Auth: technical/auth.md
      - Deployment: technical/deployment.md
      - Dual Meet Sheet Generator: technical/dual-meet-sheet-generator.md
      - Named Function library: technical/named-function-library.md
      - Control Center: technical/control-center.md
      - Schedule board: technical/schedule-board.md
      - Tournament Calculator: technical/tournament-calculator.md
      - Event registry schema: technical/event-data-config.md
      - Adding a new event: technical/adding-a-new-event.md
  - Specs:
      - Overview: specs/README.md
      - Implemented:
          - Overview: specs/implemented/README.md
          - Runtime-fetched sync config: specs/implemented/sync-config-runtime-spec.md
          - Sync script configuration: specs/implemented/sync-script-configuration-spec.md
          - Match Control console: specs/implemented/match-control-console-spec.md
          - Awards tab: specs/implemented/awards-podium-tab-spec.md
          - Schedule screen: specs/implemented/schedule-screen-spec.md
          - Scoresheet event picker: specs/implemented/scoresheet-event-picker-spec.md
          - Calculator dual-meet fixes: specs/implemented/calculator-dual-meet-spec.md
          - Calculator PWA: specs/implemented/calculator-pwa-spec.md
          - Bracket Generator: specs/implemented/bracket-generator-spec.md
          - Sheet generator (Phase 1): specs/implemented/dual-meet-sheet-generator-spec.md
          - Schedule generator (Phase 2): specs/implemented/dual-meet-schedule-generator-spec.md
          - Readouts generator (Phase 3): specs/implemented/dual-meet-readouts-generator-spec.md
          - Event site templates: specs/implemented/event-templates-spec.md
          - PNF x BUP dual meet: specs/implemented/pnf-x-bup-dual-meet-spec.md
      - In progress:
          - Overview: specs/in-progress/README.md
          - Verifiable draw: specs/in-progress/bracket-generator-verifiable-draw-spec.md
      - Not started:
          - Overview: specs/not-started/README.md
          - Standard Tournament Master: specs/not-started/standard-tournament-master-spec.md
          - Fast data delivery: specs/not-started/fast-data-delivery-spec.md
          - Fast data delivery - explainer: specs/not-started/fast-data-delivery-explainer.md
          - Bracket Generator workbook handoff: specs/not-started/bracket-generator-workbook-handoff-spec.md

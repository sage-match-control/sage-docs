name: Deploy docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check the docs version matches the changelog
        run: |
          site=$(sed -n "s/^copyright: .*>v\([0-9][0-9.]*\)<.*/\1/p" mkdocs.yml)
          log=$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' docs/changelog.md | head -n 1)
          if [ -z "$site" ] || [ "$site" != "$log" ]; then
            echo "::error::mkdocs.yml says v${site:-?}, docs/changelog.md's latest entry is ${log:-missing}. Bump both together."
            exit 1
          fi
          echo "Docs v$site"
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force

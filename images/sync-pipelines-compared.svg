<svg xmlns="http://www.w3.org/2000/svg" width="680" height="426" viewBox="0 0 680 426" role="img">
<title>Three ways a score reaches a screen</title>
<desc>Three rows of four steps each: the old sync with a delayed trigger and a GitHub Pages build (about 105 seconds), the proposed Cloudflare R2 pipeline (about 5 to 7 seconds, not built), and the running Cloudflare Worker push (about 2 to 5 seconds), followed by bars showing edit-to-screen time on one scale.</desc>
<style>
  text { font-family: "Segoe UI", Inter, Arial, sans-serif; }
  .t { font-size: 14px; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray .th, .gray .t { fill: #444441; }
  .gray .ts { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .teal .th, .teal .t { fill: #085041; }
  .teal .ts { fill: #0F6E56; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="426" fill="#FFFFFF"/>
<text class="th" x="40" y="26" dominant-baseline="central">Before: delayed trigger, GitHub Pages</text>
<text class="th" x="640" y="26" text-anchor="end" dominant-baseline="central">~105 s</text>
<g class="gray"><rect x="40" y="42" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="60" text-anchor="middle" dominant-baseline="central">Apps Script</text><text class="ts" x="100" y="80" text-anchor="middle" dominant-baseline="central">~74 s median</text></g>
<g class="gray"><rect x="200" y="42" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="260" y="60" text-anchor="middle" dominant-baseline="central">Cloud Run</text><text class="ts" x="260" y="80" text-anchor="middle" dominant-baseline="central">1.6 s</text></g>
<g class="gray"><rect x="360" y="42" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="420" y="60" text-anchor="middle" dominant-baseline="central">Pages build</text><text class="ts" x="420" y="80" text-anchor="middle" dominant-baseline="central">25 s (p50)</text></g>
<g class="gray"><rect x="520" y="42" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="580" y="60" text-anchor="middle" dominant-baseline="central">Page poll</text><text class="ts" x="580" y="80" text-anchor="middle" dominant-baseline="central">5 s avg</text></g>
<line x1="170" y1="70" x2="190" y2="70" class="arr" marker-end="url(#arrow)"/><line x1="330" y1="70" x2="350" y2="70" class="arr" marker-end="url(#arrow)"/><line x1="490" y1="70" x2="510" y2="70" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="40" y="126" dominant-baseline="central">Proposed: Cloudflare R2, pointer polling (not built)</text>
<text class="th" x="640" y="126" text-anchor="end" dominant-baseline="central">~5–7 s</text>
<g class="gray"><rect x="40" y="142" width="120" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="100" y="160" text-anchor="middle" dominant-baseline="central">Apps Script</text><text class="ts" x="100" y="180" text-anchor="middle" dominant-baseline="central">~1.5 s lock</text></g>
<g class="gray"><rect x="200" y="142" width="120" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="260" y="160" text-anchor="middle" dominant-baseline="central">Cloud Run</text><text class="ts" x="260" y="180" text-anchor="middle" dominant-baseline="central">~2 s</text></g>
<g class="gray"><rect x="360" y="142" width="120" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="420" y="160" text-anchor="middle" dominant-baseline="central">R2 + CDN</text><text class="ts" x="420" y="180" text-anchor="middle" dominant-baseline="central">≤2 s cache</text></g>
<g class="gray"><rect x="520" y="142" width="120" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="580" y="160" text-anchor="middle" dominant-baseline="central">Pointer poll</text><text class="ts" x="580" y="180" text-anchor="middle" dominant-baseline="central">1.5 s avg</text></g>
<line x1="170" y1="170" x2="190" y2="170" class="arr" marker-end="url(#arrow)"/><line x1="330" y1="170" x2="350" y2="170" class="arr" marker-end="url(#arrow)"/><line x1="490" y1="170" x2="510" y2="170" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="40" y="226" dominant-baseline="central">Running now: Cloudflare Worker push</text>
<text class="th" x="640" y="226" text-anchor="end" dominant-baseline="central">~2–5 s</text>
<g class="teal"><rect x="40" y="242" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="260" text-anchor="middle" dominant-baseline="central">Apps Script</text><text class="ts" x="100" y="280" text-anchor="middle" dominant-baseline="central">~1.5 s</text></g>
<g class="teal"><rect x="200" y="242" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="260" y="260" text-anchor="middle" dominant-baseline="central">Cloud Run</text><text class="ts" x="260" y="280" text-anchor="middle" dominant-baseline="central">~2 s</text></g>
<g class="teal"><rect x="360" y="242" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="420" y="260" text-anchor="middle" dominant-baseline="central">Worker</text><text class="ts" x="420" y="280" text-anchor="middle" dominant-baseline="central">&lt;0.5 s push</text></g>
<g class="teal"><rect x="520" y="242" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="580" y="260" text-anchor="middle" dominant-baseline="central">Open page</text><text class="ts" x="580" y="280" text-anchor="middle" dominant-baseline="central">no polling</text></g>
<line x1="170" y1="270" x2="190" y2="270" class="arr" marker-end="url(#arrow)"/><line x1="330" y1="270" x2="350" y2="270" class="arr" marker-end="url(#arrow)"/><line x1="490" y1="270" x2="510" y2="270" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="326" dominant-baseline="central">Edit to screen, drawn to one scale</text>
<g class="gray"><rect x="40" y="340" width="578" height="22" rx="4" stroke-width="0.5"/><text class="t" x="52" y="351" dominant-baseline="central">Before  ~105 s</text></g>
<g class="gray"><rect x="40" y="370" width="33" height="22" rx="4" stroke-width="0.5"/></g>
<text class="t" x="85" y="381" dominant-baseline="central">Proposed R2  ~5–7 s</text>
<g class="teal"><rect x="40" y="400" width="19" height="22" rx="4" stroke-width="0.5"/></g>
<text class="t" x="71" y="411" dominant-baseline="central">Worker push  ~2–5 s</text>
</svg>
